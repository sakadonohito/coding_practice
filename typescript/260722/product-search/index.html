<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>商品検索</title>
  </head>

  <body>
    <main class="container">
      <h1>商品検索</h1>

      <form id="search-form">
        <label for="keyword">
          商品名
        </label>

        <div class="search-row">
          <input
            id="keyword"
            name="keyword"
            type="search"
            autocomplete="off"
          />

          <button
            id="search-button"
            type="submit"
          >
            検索
          </button>
        </div>
      </form>

      <p
        id="status-message"
        aria-live="polite"
      ></p>

      <ul id="product-list"></ul>
    </main>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
